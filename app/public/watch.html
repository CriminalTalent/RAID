<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAID 관전</title>
<link rel="stylesheet" href="/assets/raid.css">
<script src="/assets/raid.js"></script>
</head>
<body>
<div class="page">
  <div class="tabs" id="tabs"></div>
  <div id="root"></div>
</div>
<script>
navBar('watch');
let data = { battles: [] }, skew = 0, selected = decodeURIComponent(location.hash.slice(1));

async function load() {
  data = await api('/api/battles');
  skew = data.now - Math.floor(Date.now() / 1000);
  render();
}

function render() {
  const list = data.battles || [];
  if (!list.length) { $('tabs').innerHTML = ''; $('root').innerHTML = '<div class="card empty">진행 중인 레이드가 없습니다.</div>'; return; }
  if (!list.find(b => b.id === selected)) selected = list[0].id;
  $('tabs').innerHTML = list.length > 1 ? list.map(b =>
    `<button class="${b.id === selected ? 'on' : ''}" data-id="${esc(b.id)}">${esc(b.creature?.name || '전투')}${b.active ? '' : ' · 종료'}</button>`).join('') : '';
  $('tabs').querySelectorAll('button').forEach(x => x.onclick = () => { selected = x.dataset.id; history.replaceState(null, '', '#' + selected); render(); });

  const b = list.find(x => x.id === selected);
  $('root').innerHTML = `
  <div class="stage">
    <div class="card"><div class="panel-h">러너 팀 · ${(b.runners || []).length}명</div>${teamHTML(b)}</div>
    <div class="card center">
      <div class="status" style="text-align:left"><span><b>${b.phase === 'prep' ? '준비' : b.round + '라운드'}</b> <span class="sub">${esc(b.active ? (PHASE[b.phase] || '') : '전투 종료')}</span></span>
        <span class="timer">${b.phase === 'battle' ? `제출 ${(b.submitted || []).length}/${b.required}` : ''}</span></div>
      ${gridHTML(b)}
      <div class="bigtimer" data-bigtimer="${esc(b.id)}">${bigTimer(b, skew)}</div>
      <div class="sub">${b.active ? (b.phase === 'battle' ? '행동 입력 마감까지' : b.phase === 'prep' ? '시작 위치 입력 마감까지' : esc(PHASE[b.phase] || '')) : '전투가 끝났습니다'}</div>
    </div>
    <div>
      <div class="card"><div class="panel-h boss">보스</div>${bossCardHTML(b)}</div>
      <div class="card"><div class="card-h"><h2>전투 기록</h2><span class="sub">최신이 위</span></div><div class="log" style="max-height:460px">${logHTML(b)}</div></div>
    </div>
  </div>`;
}
live(load);
startTimers(() => data.battles, () => skew);
</script>
</body>
</html>
