<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레이드 관리자</title>
<link rel="stylesheet" href="/assets/raid.css">
<script src="/assets/raid.js"></script>
</head>
<body>
<header>
  <h1>레이드 관리자</h1>
  <div class="tabs" id="tabs"></div>
  <a href="/watch" target="_blank" style="margin-left:auto">관전 페이지 열기 ↗</a>
</header>
<div class="wrap" id="root"></div>
<script>
let key = localStorage.getItem('raidAdminKey') || '';
let view = null, live = { battles: [] }, skew = 0;
let tab = 'battle';
let bossPick = {};   // 전투별 보스 지정 중인 값 { skill, targets:Set, cells:Set }
let msg = null;
let shareBase = localStorage.getItem('raidShareBase') || '';
const form = { runners: new Set(), creature: '', auto: false };  // 새로고침해도 고른 값 유지
const TABS = { battle: '전투 진행', runners: '러너 스탯', creatures: '크리쳐 스탯', boss_skills: '보스 스킬', skills: '기본 스킬' };
const HELP = {
  runners: 'ID는 영문/숫자로 겹치지 않게 적어 주세요. 건강은 현재 체력(전투 중 자동으로 바뀜), 최대건강은 최대 체력이에요. 기숙사는 그리핀도르/슬리데린/래번클로/후플푸프, 패시브선택은 1 또는 2.',
  creatures: '활성 칸은 비워 둬도 됩니다(전투 시작 때 이름으로 고름). 위치는 A1~G8, 크기는 2x2처럼. 현재스킬을 적어 두면 자동 모드에서도 그 스킬만 써요.',
  boss_skills: '보스가 쓸 스킬 목록이에요. 분류 "공격", 범위에 "전체" 또는 칸 목록(C6,D6), 배율, 대상수, 전조(라운드 시작 때 보이는 예고 문구).'
};

const H = () => ({ 'X-Admin-Key': key });

async function load() {
  try {
    [view, live] = await Promise.all([api('/api/admin', undefined, H()), api('/api/battles')]);
    skew = live.now - Math.floor(Date.now() / 1000);
    render();
  } catch (e) {
    if (/비밀번호/.test(e.message)) return loginScreen(e.message);
    msg = { cls: 'err', text: e.message }; render();
  }
}

async function act(path, body, okText) {
  try {
    view = await api(path, body, H());
    live = await api('/api/battles');
    msg = okText ? { cls: 'ok', text: okText } : null;
  } catch (e) { msg = { cls: 'err', text: e.message }; }
  render();
}

function loginScreen(err) {
  $('tabs').innerHTML = '';
  $('root').innerHTML = `<div class="panel" style="max-width:420px">
    <h2>관리자 비밀번호</h2>
    <p class="muted">프로그램을 켠 검은 창에 나온 "관리자 비밀번호"를 넣으세요.</p>
    ${err && key ? `<div class="msg err">${esc(err)}</div>` : ''}
    <div class="row"><input id="pw" type="password" autofocus><button class="primary" id="go">들어가기</button></div></div>`;
  const go = () => { key = $('pw').value.trim(); localStorage.setItem('raidAdminKey', key); load(); };
  $('go').onclick = go; $('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function render() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${v}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; msg = null; render(); });
  const m = msg ? `<div class="msg ${msg.cls}">${esc(msg.text)}</div>` : '';
  if (tab === 'battle') { $('root').innerHTML = m + battleTab(); bindBattle(); }
  else if (tab === 'skills') { $('root').innerHTML = m + skillsTab(); bindSkills(); }
  else { $('root').innerHTML = m + tableTab(tab); bindTable(tab); }
}

/* ── 전투 진행 ─────────────────────────────── */
function battleTab() {
  const busy = new Set(view.battles.filter(b => b.active).flatMap(b => b.runners));
  let h = `<div class="panel"><h2>새 전투 시작</h2>
    <h3 style="margin-top:0">참여자</h3>
    <div>${view.runner_ids.map(id => `<label class="chk"><input type="checkbox" name="runner" value="${esc(id)}" ${busy.has(id) ? 'disabled' : ''} ${form.runners.has(id) && !busy.has(id) ? 'checked' : ''}>${esc(id)}${busy.has(id) ? ' (전투 중)' : ''}</label>`).join('') || '<span class="muted">러너 스탯 탭에서 먼저 러너를 추가하세요.</span>'}</div>
    <h3>상대 크리쳐</h3>
    <div class="row"><select id="creature">${view.creature_names.map(n => `<option ${form.creature === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <label class="chk" style="margin:0"><input type="checkbox" id="auto" ${form.auto ? 'checked' : ''}>보스 자동 행동</label>
      <button class="primary" id="start">전투 시작</button>
      <button id="heal" title="모든 러너의 건강을 최대건강으로">러너 전원 체력 회복</button></div>
  </div>`;
  const list = view.battles.slice().reverse();
  if (!list.length) h += '<div class="panel muted">진행 중인 전투가 없습니다.</div>';
  list.forEach(b => { h += battleCard(b); });
  return h;
}

function battleCard(b) {
  const lb = (live.battles || []).find(x => x.id === b.id) || {};
  const pick = bossPick[b.id] || (bossPick[b.id] = { skill: '', targets: new Set(), cells: new Set() });
  const links = Object.entries(b.tokens).map(([name, t]) => {
    const url = `${(shareBase || location.origin).replace(/\/+$/, '')}/play?t=${t}`;
    return `<div class="linkbox"><b style="min-width:80px">${esc(name)}</b><code>${esc(url)}</code><button data-copy="${esc(url)}">복사</button>${b.actions[name] ? `<span class="tag ok">${esc(b.actions[name])}</span>` : ''}</div>`;
  }).join('');

  let boss = '';
  if (b.active && b.awaiting_boss) {
    boss = `<div class="msg info">보스 행동을 정해 주세요. 스킬을 고르고, 필요하면 대상 러너나 격자 칸(범위)을 고른 뒤 "보스 행동 확정".</div>
      <div class="row">${view.boss_skills.map(s => `<button data-bskill="${b.id}|${esc(s)}" class="${pick.skill === s ? 'on' : ''}">${esc(s)}</button>`).join('')}</div>
      <h3>대상 러너 (선택)</h3><div class="row">${b.runners.map(r => `<button data-btarget="${b.id}|${esc(r)}" class="${pick.targets.has(r) ? 'on' : ''}">${esc(r)}</button>`).join('')}</div>
      <p class="muted">범위 칸을 지정하려면 왼쪽 격자를 누르세요. 선택: ${[...pick.cells].join(', ') || '없음'}</p>
      <div class="row"><button class="primary" data-bgo="${b.id}" ${pick.skill ? '' : 'disabled'}>보스 행동 확정</button>
      <button data-bclear="${b.id}">선택 지우기</button></div>`;
  }

  return `<div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${esc(b.creature)} · ${b.phase === 'prep' ? '준비' : b.round + '라운드'} <span class="muted">${b.active ? esc(PHASE[b.phase] || '') : '종료'}</span></h2>
      <span class="muted" data-timer="${b.id}"></span>
    </div>
    <div class="cols" style="margin-top:12px">
      <div><div data-grid="${b.id}">${lb.creature ? gridHTML(lb, { pickable: b.awaiting_boss ? () => true : null, picks: pick.cells }) : ''}</div>${lb.creature ? unitsHTML(lb) : ''}</div>
      <div>
        ${boss}
        ${b.active ? `<div class="row" style="margin:8px 0 12px">
          <button data-auto="${b.id}" class="${b.auto ? 'on' : ''}">보스 자동 행동 ${b.auto ? '켜짐' : '꺼짐'}</button>
          <button data-settle="${b.id}" ${b.phase === 'battle' || b.phase === 'prep' ? '' : 'disabled'}>입력 마감하고 바로 진행</button>
          <button class="danger" data-end="${b.id}">전투 종료</button></div>` : ''}
        <h3>참여자 링크 (각자에게 보내 주세요)</h3>${links}
        <p class="muted">다른 사람이 접속하려면 공유 주소(터널 주소)를 넣으세요. 링크 앞부분이 그 주소로 바뀝니다.</p>
        <div class="row"><input data-share placeholder="예: https://xxxx.trycloudflare.com" value="${esc(shareBase)}" style="flex:1"><button data-sharesave>적용</button></div>
        <h3>전투 기록</h3><div class="log" style="max-height:320px;overflow:auto">${logHTML(lb, 10)}</div>
      </div>
    </div></div>`;
}

function bindBattle() {
  document.querySelectorAll('input[name=runner]').forEach(i => i.onchange = () => { i.checked ? form.runners.add(i.value) : form.runners.delete(i.value); });
  if ($('creature')) { $('creature').onchange = () => { form.creature = $('creature').value; }; $('auto').onchange = () => { form.auto = $('auto').checked; }; }
  const st = $('start');
  if (st) st.onclick = () => {
    form.runners.clear();
    const runners = [...document.querySelectorAll('input[name=runner]:checked')].map(i => i.value);
    act('/api/admin/start', { runners, creature: $('creature').value, auto: $('auto').checked }, '전투를 시작했습니다. 아래 참여자 링크를 각자에게 보내 주세요.');
  };
  const hl = $('heal'); if (hl) hl.onclick = () => act('/api/admin/heal', {}, '러너 전원의 체력을 최대로 채웠습니다.');
  document.querySelectorAll('[data-sharesave]').forEach(b => b.onclick = () => {
    shareBase = b.previousElementSibling.value.trim(); localStorage.setItem('raidShareBase', shareBase); render();
  });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '복사됨'; } catch { prompt('복사하세요', b.dataset.copy); }
  });
  document.querySelectorAll('[data-bskill]').forEach(b => b.onclick = () => { const [id, s] = b.dataset.bskill.split('|'); bossPick[id].skill = s; render(); });
  document.querySelectorAll('[data-btarget]').forEach(b => b.onclick = () => { const [id, r] = b.dataset.btarget.split('|'); const t = bossPick[id].targets; t.has(r) ? t.delete(r) : t.add(r); render(); });
  document.querySelectorAll('[data-bclear]').forEach(b => b.onclick = () => { bossPick[b.dataset.bclear] = null; render(); });
  document.querySelectorAll('[data-bgo]').forEach(b => b.onclick = () => {
    const id = b.dataset.bgo, p = bossPick[id];
    act('/api/admin/boss', { id, skill: p.skill, targets: [...p.targets], cells: [...p.cells] }, `보스 행동: ${p.skill}`);
    bossPick[id] = null;
  });
  document.querySelectorAll('[data-grid]').forEach(g => bindGrid(g, pos => {
    const p = bossPick[g.dataset.grid]; p.cells.has(pos) ? p.cells.delete(pos) : p.cells.add(pos); render();
  }));
  document.querySelectorAll('[data-auto]').forEach(b => b.onclick = () => {
    const bt = view.battles.find(x => x.id === b.dataset.auto); act('/api/admin/auto', { id: bt.id, on: !bt.auto });
  });
  document.querySelectorAll('[data-settle]').forEach(b => b.onclick = () => act('/api/admin/settle', { id: b.dataset.settle }, '입력을 마감했습니다.'));
  document.querySelectorAll('[data-end]').forEach(b => b.onclick = () => { if (confirm('이 전투를 끝낼까요?')) act('/api/admin/end', { id: b.dataset.end }, '전투를 종료했습니다.'); });
  tick();
}

/* ── 표 편집 ──────────────────────────────── */
function tableTab(k) {
  const rows = view.tables[k] || [];
  const head = rows[0] || [];
  const body = rows.slice(1);
  return `<div class="panel"><h2>${TABS[k]}</h2><p class="muted">${HELP[k] || ''}</p>
    <div class="tablewrap"><table class="edit" id="tbl"><thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${body.map(r => rowHTML(head, r)).join('')}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button id="addrow">줄 추가</button><button class="primary" id="save">저장</button>
    <span class="muted">저장하지 않고 다른 탭으로 가면 바꾼 내용이 사라져요.</span></div></div>`;
}
function rowHTML(head, r) {
  return `<tr>${head.map((_, i) => `<td><input value="${esc(r[i] ?? '')}"></td>`).join('')}<td class="del"><button title="줄 삭제">✕</button></td></tr>`;
}
function bindTable(k) {
  const head = (view.tables[k] || [])[0] || [];
  const bindDel = () => document.querySelectorAll('#tbl td.del button').forEach(b => b.onclick = () => b.closest('tr').remove());
  bindDel();
  $('addrow').onclick = () => { $('tbl').tBodies[0].insertAdjacentHTML('beforeend', rowHTML(head, [])); bindDel(); };
  $('save').onclick = () => {
    const rows = [head, ...[...$('tbl').tBodies[0].rows].map(tr => [...tr.querySelectorAll('input')].map(i => i.value.trim()))
      .filter(r => r.some(v => v !== ''))];
    act('/api/admin/table', { key: k, rows }, '저장했습니다.');
  };
}

/* ── 기본 스킬 ─────────────────────────────── */
function skillsTab() {
  const on = new Set(view.skills);
  return `<div class="panel"><h2>참여자 화면에 나올 스킬</h2>
    <p class="muted">체크한 스킬만 참여자 화면에 버튼으로 나와요. 계산 규칙은 기존 전투봇과 같습니다. 처음에는 기본 스킬만 켜 두는 걸 추천해요.</p>
    <div>${view.all_skills.map(s => `<label class="chk"><input type="checkbox" name="sk" value="${esc(s)}" ${on.has(s) ? 'checked' : ''}>${esc(s)}</label>`).join('')}</div>
    <button class="primary" id="saveskills" style="margin-top:12px">저장</button></div>`;
}
function bindSkills() {
  $('saveskills').onclick = () => act('/api/admin/skills', { skills: [...document.querySelectorAll('input[name=sk]:checked')].map(i => i.value) }, '저장했습니다.');
}

function tick() {
  document.querySelectorAll('[data-timer]').forEach(el => {
    const b = (live.battles || []).find(x => x.id === el.dataset.timer); el.textContent = timerText(b, skew);
  });
}

if (key) load(); else loginScreen();
// 전투 탭에서만 자동 새로고침 (표 편집 중에는 입력이 지워지지 않도록 멈춤)
setInterval(() => { if (key && tab === 'battle' && document.activeElement?.tagName !== 'INPUT') load(); }, 3000);
setInterval(tick, 1000);
</script>
</body>
</html>
