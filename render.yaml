# Render(render.com) 블루프린트: 저장소를 연결하면 이 설정대로 서버가 만들어진다.
# 무료 플랜은 디스크가 없어 껐다 켜면 데이터가 초기화되므로, 디스크를 쓰려면 유료(Starter) 플랜이 필요하다.
services:
  - type: web
    name: raid
    runtime: docker
    plan: starter
    healthCheckPath: /api/battles
    envVars:
      - key: RAID_ADMIN_PASSWORD
        sync: false
      - key: RAID_DATA_DIR
        value: /data
    disk:
      name: raid-data
      mountPath: /data
      sizeGB: 1
